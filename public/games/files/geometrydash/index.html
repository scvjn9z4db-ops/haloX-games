<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Web Dashers</title>
    <style>
        /* Remove default margins and hide scrollbars on the main page */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Optional: background color while loading */
        }

        /* Stretch the iframe to cover the entire viewport */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe 
        src="https://webdashers-gamma.vercel.app/" 
        allow="fullscreen">
    </iframe>

</body>
</html>

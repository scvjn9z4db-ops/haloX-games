    "I chose the obvious option. The game admired my confidence.",
    "The riddle had a simple answer and a complicated eyebrow raise.",
    "I clicked every object. The solution was the first one.",
    "The game gave me a puzzle. I gave it a long stare.",
    "I have a plan for the next round. It is a different plan.",
    "I lost track of time. Time seems to have won.",
    "My gaming chair deserves an assist on that victory.",
    "My snacks are in co-op mode: everyone gets a turn.",
    "I reached the credits. The game finally knows my name."
  ];
  function randomJoke(excludedJoke = "") {
    let joke;
    do { joke = jokes[Math.floor(Math.random() * jokes.length)]; } while (joke === excludedJoke);
    return joke;
  }
  const welcomeJoke = randomJoke();
  document.getElementById("welcome-joke").textContent = welcomeJoke;
  async function loadFeaturedGames() {
    const grid = document.getElementById("featured-grid");
    try {
      const response = await fetch("/games/games-list.json");
      if (!response.ok) throw new Error("Could not load games");
      const games = (await response.json()).filter((game) => game.file && game.thumbnail);
      for (let index = games.length - 1; index > 0; index--) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [games[index], games[swapIndex]] = [games[swapIndex], games[index]];
      }
      const playableGames = [];
      for (const game of games) {
        const gameResponse = await fetch(game.file, { method: "HEAD" });
        if (gameResponse.ok) playableGames.push(game);
        if (playableGames.length === 4) break;
      }
      playableGames.forEach((game, index) => {
        const card = document.createElement("a");
        card.className = "featured-card";
        card.href = game.file;

        const image = document.createElement("img");
        image.src = game.thumbnail;
        image.alt = game.title;
        image.loading = "lazy";

        const copy = document.createElement("span");
        copy.className = "featured-copy";
        const name = document.createElement("span");
        name.className = "featured-name";
        name.textContent = game.title;
        const joke = document.createElement("span");
        joke.className = "featured-joke";
        joke.textContent = randomJoke();

        copy.append(name, joke);
        card.append(image, copy);
        grid.append(card);
      });
    } catch {
      grid.textContent = "The games are taking a quick respawn.";
    }
  }
  loadFeaturedGames();
  const dismissWelcome = () => welcomeScreen.classList.add("dismissed");
  window.setTimeout(dismissWelcome, 6000);
</script>

<div id="vanta-bg" style="position:fixed;inset:0;z-index:-1;width:100%;height:100%;"></div>
<script>
window.addEventListener("load", function() {
  if (typeof VANTA === "undefined") return;
  var pref; try { pref = JSON.parse(localStorage.getItem('astriex_background') || '"clouds"'); } catch(e) { pref = 'clouds'; }
  if (pref === 'minimal') { document.getElementById('vanta-bg').style.background = '#2d2d2d'; return; }
  var speed = pref === 'clouds_slow' ? 0.60 : 1.60;
  VANTA.CLOUDS({
    el: "#vanta-bg", mouseControls: false, touchControls: false, gyroControls: false,
    minHeight: 200, minWidth: 200, backgroundColor: 0x333333, skyColor: 0x292929,
    cloudColor: 0x444444, cloudShadowColor: 0x818181, sunColor: 0x747474,
    sunGlareColor: 0x7c7c7c, sunlightColor: 0x474747, speed: speed
  });
});
</script>
